name: Check
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Validate Compose profiles
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.local.yaml config -q
          export PULSEC_DOMAIN=chat.example.org PULSEC_WEBROOT=/srv/acme PULSEC_UPSTREAM_CA=/etc/caddy/origin.crt
          public_ports='[.ports[] | "\(.published)/\(.protocol)"] | sort == ["443/tcp", "443/udp", "80/tcp"]'
          docker compose -f compose.yaml -f compose.direct.yaml config --format json |
            jq -e ".services.pulsec | $public_ports"
          docker compose -f compose.yaml -f compose.caddy.yaml config --format json |
            jq -e ".services | (.pulsec.ports // [] | length == 0) and (.caddy | $public_ports)"
      - name: Verify certificate publication and retries
        run: sh qa/certbot-deploy.sh
      - run: make tools
      - run: make check security
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          go test -run=^$ -fuzz=FuzzUntrustedCommand -fuzztime=30s ./internal/chat
          PULSEC_CHURN_BIN="$PWD/dist/pulsec" go test -timeout=12m -count=1 -run=TestWebTransportChurn ./qa
          cd qa
          npm ci --no-audit --no-fund
          npm test
      - name: Verify both Docker distribution paths
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          export PULSEC_IMAGE=pulsec-ci:source
          docker compose build
          python3 tools/check-image.py "$PULSEC_IMAGE"
          sh qa/compose.sh
          mkdir -p dist/release
          cp dist/pulsec dist/release/pulsec
          export PULSEC_IMAGE=pulsec-ci:artifact PULSEC_TARGET=artifact
          docker compose build
          python3 tools/check-image.py "$PULSEC_IMAGE" dist/release/pulsec
          sh qa/compose.sh
      - name: Verify Caddy WebTransport proxy
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          docker build -f deploy/Dockerfile.caddy --output "type=local,dest=$RUNNER_TEMP/caddy-root" deploy
          CADDY_BIN="$RUNNER_TEMP/caddy-root/usr/bin/caddy" PULSEC_BIN="$PWD/dist/pulsec" bash qa/caddy.sh
